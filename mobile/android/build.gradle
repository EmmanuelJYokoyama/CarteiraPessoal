buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
    }
}

allprojects {
    repositories {
        // AsyncStorage v3 ships storage-android in a local Maven repo within node_modules.
        maven {
            url("$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo")
        }
    }
}

gradle.projectsEvaluated {
    allprojects { project ->
        def reposToRemove = project.repositories.findAll { repo ->
            repo.hasProperty('url') &&
                repo.url.toString().contains("central.sonatype.com/repository/maven-snapshots")
        }
        reposToRemove.each { repo ->
            project.repositories.remove(repo)
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
